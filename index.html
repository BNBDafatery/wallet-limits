  :root {
    color-scheme: light;
    --bg: #eef1f4;
    --card: #ffffff;
    --ink: #0e1726;
    --muted: #5c6778;
    --line: #e3e7ee;
    --navy: #0e1c33;
    --gold: #b0893e;
    --red: #b42318;
    --red-2: #fef3f2;
    --green: #067647;
    --green-2: #e7f6ee;
    --amber: #b54708;
    --shadow: 0 1px 1px rgba(14, 23, 38, .04), 0 10px 28px rgba(14, 23, 38, .06);
    --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(900px 280px at 100% -40px, rgba(176, 137, 62, .14), transparent 55%),
      var(--bg);
  }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 20px 28px; }
  .head {
    position: sticky; top: 0; z-index: 20;
    background: rgba(238, 241, 244, .92);
    backdrop-filter: blur(16px);
    padding-bottom: 12px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark {
    width: 48px; height: 48px; border-radius: 14px; background: var(--navy); color: #f3e6c8;
    display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .06em; flex: none;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: -.03em; line-height: 1.15; }
  .co { margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .clockbox { text-align: center; min-width: 168px; }
  .date { color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .clock {
    margin-top: 3px; display: flex; align-items: baseline; justify-content: center; gap: 1px;
    font-size: 28px; font-weight: 700; letter-spacing: .04em; color: var(--ink); line-height: 1;
  }
  .clock .sec { color: var(--gold); font-size: 22px; }
  .clock .ampm { margin-inline-start: 6px; font-size: 13px; font-weight: 800; color: var(--muted); }
  .livedot {
    width: 8px; height: 8px; border-radius: 99px; background: #12b76a; align-self: center;
    margin-inline-end: 7px; animation: livebeat 1s ease-out infinite;
  }
  @keyframes livebeat {
    0% { box-shadow: 0 0 0 0 rgba(18, 183, 106, .55); }
    70% { box-shadow: 0 0 0 7px rgba(18, 183, 106, 0); }
    100% { box-shadow: 0 0 0 0 rgba(18, 183, 106, 0); }
  }
  button.line.gear { background: var(--navy); color: #f3e6c8; border-color: transparent; }
  button.line.gear svg { display: block; }
  .btns { display: flex; gap: 8px; }
  button.solid, button.line, button.quiet, button.stop {
    border-radius: 12px; padding: 9px 13px; font-weight: 700; font-size: 14px;
  }
  button.solid { background: var(--navy); color: white; border: 0; }
  button.line { background: white; border: 1px solid #d5dbe3; color: var(--ink); }
  button.quiet { background: transparent; border: 0; color: var(--muted); font-weight: 700; }
  button.stop { background: var(--red); color: white; border: 0; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .tools { display: flex; gap: 10px; margin-top: 14px; }
  .search { flex: 1; }
  .search input, .field input, .amount {
    width: 100%; background: white; border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; font-size: 15px; color: inherit;
  }
  .search input:focus, .field input:focus, .amount:focus {
    outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(14, 28, 51, .12);
  }
  .filters { display: flex; gap: 4px; background: rgba(255,255,255,.55); border-radius: 999px; padding: 4px; }
  .filters button {
    border: 0; background: transparent; border-radius: 999px; padding: 8px 14px;
    font-weight: 700; color: var(--muted);
  }
  .filters button.on { background: white; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 14px; }
  .stat {
    background: linear-gradient(180deg, #182433 0%, #101826 100%);
    border: 1px solid #2a3a50; border-radius: 16px; padding: 10px 12px 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 22px rgba(14, 23, 38, .1);
  }
  .stat span {
    display: block; color: #93a4b8; font-size: 12px; font-weight: 700; letter-spacing: .04em;
  }
  .stat b {
    display: block; margin-top: 8px; padding: 8px 6px 6px; border-radius: 10px; text-align: center;
    background: #070d16; border: 1px solid rgba(255,255,255,.06);
    font-family: Consolas, "Cascadia Mono", "Segoe UI Mono", monospace;
    font-size: 48px; font-weight: 700; line-height: 1; letter-spacing: .01em;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .stat.bal b { color: #8dffc0; text-shadow: 0 0 16px rgba(141, 255, 192, .45); }
  .stat.count b { color: #f3e6c8; text-shadow: 0 0 16px rgba(243, 230, 200, .4); }
  .stat.fee b { color: #ffd36a; text-shadow: 0 0 16px rgba(255, 211, 106, .4); }
  .stat.out b { color: #ff9b94; text-shadow: 0 0 16px rgba(255, 155, 148, .4); }
  .stat.in b { color: #5dffa8; text-shadow: 0 0 16px rgba(93, 255, 168, .4); }
  .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .group { margin-top: 26px; }
  .group-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 12px; }
  .group-h h2 { margin: 0; font-size: 20px; }
  .group-h span { color: var(--muted); font-size: 13px; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; margin-top: 14px; }
  .more { display: block; margin: 16px auto 0; }
  .card {
    position: relative; background: var(--card); border: 1px solid #d7dee8; border-radius: 16px;
    padding: 11px 12px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px;
    overflow: hidden;
  }
  .card.wallet { box-shadow: inset 0 3px 0 var(--green), var(--shadow); }
  .card.bank { box-shadow: inset 0 3px 0 #1d4e89, var(--shadow); }
  .card.pop { animation: pop .25s ease; }
  .card.wallet.live { animation: live-w 1.4s ease-in-out infinite; }
  .card.bank.live { animation: live-b 1.4s ease-in-out infinite; }
  @keyframes pop { from { transform: translateY(-3px); } to { transform: none; } }
  @keyframes live-w {
    0%, 100% { box-shadow: inset 0 3px 0 var(--green), 0 0 0 2px rgba(224, 177, 90, .45), 0 0 12px rgba(224, 177, 90, .28); }
    50% { box-shadow: inset 0 3px 0 var(--green), 0 0 0 3px #f0c14b, 0 0 24px rgba(240, 193, 75, .75); }
  }
  @keyframes live-b {
    0%, 100% { box-shadow: inset 0 3px 0 #1d4e89, 0 0 0 2px rgba(224, 177, 90, .45), 0 0 12px rgba(224, 177, 90, .28); }
    50% { box-shadow: inset 0 3px 0 #1d4e89, 0 0 0 3px #f0c14b, 0 0 24px rgba(240, 193, 75, .75); }
  }
  @keyframes live-b-dark {
    0%, 100% { box-shadow: inset 0 3px 0 #7eb0e8, 0 0 0 2px rgba(224, 196, 138, .45), 0 0 12px rgba(224, 196, 138, .3); }
    50% { box-shadow: inset 0 3px 0 #7eb0e8, 0 0 0 3px #e0c48a, 0 0 24px rgba(224, 196, 138, .7); }
  }
  .top { display: flex; justify-content: space-between; gap: 8px; }
  .who { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tag, .emp {
    font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 8px;
  }
  .tag.wallet { background: var(--green-2); color: var(--green); }
  .tag.bank { background: #e8eef8; color: #1d3e66; }
  .emp { background: #f6f1ea; color: #5c5348; }
  .top-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .top-actions .quiet {
    border: 1px solid #c5ced8; border-radius: 10px; background: #fff; padding: 5px 8px; font-size: 12px;
  }
  .top-actions .quiet:hover { border-color: var(--navy); }
  .top-actions .quiet.lock-on {
    background: #fff4d6; border-color: #e0b15a; color: #8a5a00;
    box-shadow: 0 0 0 2px rgba(224, 177, 90, .4), 0 0 12px rgba(224, 177, 90, .55);
  }
  .flags { display: flex; flex-direction: column; gap: 4px; }
  .owner { margin-top: 2px; font-size: 17px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; display: flex; align-items: center; gap: 8px; }
  .lamp {
    width: 12px; height: 12px; border-radius: 99px; flex: none; background: #f5c14a;
    box-shadow: 0 0 0 4px rgba(245, 193, 74, .32), 0 0 10px #f5c14a;
    animation: lamp 1.1s ease-in-out infinite;
  }
  @keyframes lamp {
    0%, 100% { transform: scale(.88); opacity: .72; }
    50% { transform: scale(1.18); opacity: 1; }
  }
  .phone {
    margin-top: 0; border: 1px solid #c5ced8; background: #f7f9fb; border-radius: 12px;
    padding: 8px 8px 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .phone .num { font-size: 26px; font-weight: 700; letter-spacing: .03em; line-height: 1; }
  .phone .copy {
    width: 40px; height: 40px; flex: none; border: 1px solid #c5ced8; border-radius: 10px;
    background: #fff; color: var(--navy); display: grid; place-items: center;
  }
  .phone .copy:hover { border-color: var(--navy); }
  .recv { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; color: #3e4856; line-height: 1.2; }
  .recv b { color: var(--green); font-size: 13px; }
  .alerts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .alerts span { border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 800; }
  .alerts .hot { background: var(--red-2); color: var(--red); }
  .alerts .warn { background: #fff6e8; color: #8a5a00; }
  .flag {
    border-radius: 10px; padding: 6px 8px; font-size: 12px; font-weight: 800; line-height: 1.35;
  }
  .flag.hot { background: var(--red-2); color: var(--red); }
  .flag.warn { background: #fff6e8; color: #8a5a00; }
  .metrics { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; }
  .balance, .lim {
    border: 1px solid #e1e6ee; border-radius: 12px; padding: 8px 10px 7px; background: #fff;
  }
  .balance { background: #f4faf6; border-color: #cfe3d8; }
  .lim.warn { background: #fffaf2; border-color: #efd7a8; }
  .lim.hot { background: #fdf4f4; border-color: #f0cccc; }
  .k { color: #3d4654; font-size: 12px; font-weight: 800; }
  .balance strong { display: block; margin-top: 3px; font-size: 22px; letter-spacing: -.03em; line-height: 1.05; color: #0e1726; }
  .balance strong small { font-size: 12px; color: #5c6778; font-weight: 700; margin-inline-start: 3px; }
  .lim b { display: block; margin: 3px 0 1px; font-size: 18px; letter-spacing: -.03em; color: #0e1726; }
  .lim b.hot, .balance strong.hot { color: var(--red); }
  .lim b.warn { color: var(--amber); }
  .cap { color: #4e5866; font-size: 12px; font-weight: 700; }
  .bar { height: 4px; background: #e6eaf0; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
  .bar.warn i { background: #d08900; }
  .bar.hot i { background: var(--red); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .go {
    border: 1px solid rgba(14, 23, 38, .22); border-radius: 12px; color: white; min-height: 46px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.05;
  }
  .go b { font-size: 15px; font-weight: 700; }
  .go small { font-size: 11px; font-weight: 600; opacity: .88; }
  .go.out { background: var(--red); }
  .go.in { background: var(--green); }
  .go:active { transform: translateY(1px); }
  .go:disabled { opacity: .38; }
  .card.closed { background: #f6f7f9; }
  .tag.shut { background: #eceff3; color: #4d5663; }
  .pin.on { color: var(--navy); }
  .licrow { display: flex; align-items: center; gap: 8px; }
  #activateBtn { padding: 6px 10px; font-size: 13px; white-space: nowrap; }
  #activateBtn[hidden] { display: none; }
  .bell { position: relative; }
  .bell-n {

      gain.gain.exponentialRampToValueAtTime(0.09, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);

    upsertFeed('week-' + start, 'الأسبوع', 'الأسبوع ده أرسلت ' + shownMoney(thisWeek.out) + ' واستلمت ' + shownMoney(thisWeek.inn) + '. ' + whichMore(thisWeek.out, thisWeek.inn) + '. الأسبوع اللي فات أرسلت ' + shownMoney(lastWeek.out) + ' واستلمت ' + shownMoney(lastWeek.inn) + '.');

  closeModal();
  commit();
  toast('تمت التسوية');
}
async function settleAll() {
  if (!state.wallets.length) return;
  if (!await ask('تسوية كل المحافظ؟ هترجع صفر', 'تسوية')) return;
  state.wallets.forEach((w) => { w.openingBalance = 0; });
  state.moves = [];
  openMoves.clear();
  closeModal();
  commit();
  toast('تمت تسوية كل المحافظ');
}
async function deleteMove(id) {
  if (!state.moves.some((m) => m.id === id)) return;
  if (!await ask('مسح الحركة؟')) return;
  state.moves = state.moves.filter((m) => m.id !== id);
  commit();
}
async function deleteWallet(id) {
  const w = state.wallets.find((x) => x.id === id);
  if (!w) return;
  if (!await ask('مسح ' + w.name + '؟')) { openWallet(id); return; }
  state.wallets = state.wallets.filter((x) => x.id !== id);
  state.moves = state.moves.filter((m) => m.walletId !== id);
  closeModal();
  commit();
}
const INSTALL_KEY = 'wallet-limits-install';
let installEvent = null;
function installSnoozed() {
  try {
    const saved = localStorage.getItem(INSTALL_KEY);
    if (saved === 'yes') return true;
    return !!saved && Date.now() < Number(saved);
  } catch (e) { return false; }
}
function runningAsApp() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function showInstall(mode) {
  if (runningAsApp() || installSnoozed()) return;
  const bar = document.getElementById('installBar');
  const title = document.getElementById('installTitle');
  const text = document.getElementById('installText');
  const yes = document.getElementById('installYes');
  if (!bar || !title || !text || !yes) return;
  if (mode === 'ios') {
    title.textContent = 'ثبّت التطبيق';
    text.textContent = 'من زر المشاركة في سفاري اختر «إضافة إلى الشاشة الرئيسية»';
    yes.hidden = true;
  } else {
    title.textContent = 'ثبّت التطبيق';
    text.textContent = 'افتح حدود المحافظ كتطبيق من غير المتصفح';
    yes.hidden = false;
  }
  bar.hidden = false;
}
function hideInstall(remember) {
  const bar = document.getElementById('installBar');
  if (bar) bar.hidden = true;
  if (!remember) return;
  try { localStorage.setItem(INSTALL_KEY, remember === 'yes' ? 'yes' : String(Date.now() + 7 * 24 * 60 * 60 * 1000)); } catch (e) {}
}
function setupInstall() {
  const yes = document.getElementById('installYes');
  const no = document.getElementById('installNo');
  if (yes) yes.onclick = async () => {
    if (!installEvent) { hideInstall('later'); return; }
    installEvent.prompt();
    const choice = await installEvent.userChoice;
    installEvent = null;
    hideInstall(choice.outcome === 'accepted' ? 'yes' : 'later');
  };
  if (no) no.onclick = () => hideInstall('later');
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installEvent = event;
    showInstall('browser');
  });
  window.addEventListener('appinstalled', () => {
    installEvent = null;
    hideInstall('yes');
    toast('تم تثبيت التطبيق');
  });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) showInstall('ios');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
setupInstall();
loadFeed();
try { hideMoney = localStorage.getItem(HIDE_KEY) === '1'; } catch (e) {}
try { darkMode = localStorage.getItem(THEME_KEY) === 'dark'; } catch (e) {}
applyTheme();
bootIdentity();
startClock();
loadState().then(() => render()).catch(() => {
  const legacy = legacyState();
  state = legacy || { v: 2, updatedAt: Date.now(), wallets: [], moves: [] };
  lastSaved = snapshot();
  render();
  toast('تعذر فتح قاعدة البيانات');
});
</script>
</body>
